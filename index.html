<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #063f36;
            color: #d8b45a;
            font-family: Georgia, "Times New Roman", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            min-height: 720px;
            border: 1px solid rgba(216, 180, 90, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 55px 35px;
            position: relative;
            background: #073f36;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 12px;
            border: 1px solid rgba(216, 180, 90, 0.35);
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 2;
        }

        .small {
            font-size: 15px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 48px;
            font-weight: normal;
            letter-spacing: 3px;
            margin-bottom: 25px;
        }

        .line {
            width: 90px;
            height: 1px;
            background: #d8b45a;
            margin: 25px auto;
        }

        .text {
            font-size: 19px;
            line-height: 1.8;
            letter-spacing: 1px;
        }

        .date {
            margin-top: 35px;
            font-size: 23px;
            letter-spacing: 3px;
        }

        .time {
            margin-top: 12px;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .bottom {
            margin-top: 45px;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        @media (max-width: 500px) {
            body {
                padding: 12px;
            }

            .card {
                min-height: 650px;
                padding: 45px 25px;
            }

            h1 {
                font-size: 38px;
            }

            .text {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="content">

            <div class="small">Приглашение</div>

            <h1>Особенный день</h1>

            <div class="line"></div>

            <div class="text">
                Будем рады разделить<br>
                этот прекрасный день<br>
                вместе с Вами.
            </div>

            <div class="date">
                ДАТА
            </div>

            <div class="time">
                14:00
            </div>

            <div class="bottom">
                Ждём Вас
            </div>

        </div>
    </div>

</body>
</html>
